[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vrp-portfolio-demo"
version = "0.1.0"
description = "Privacy-safe CVRPTW comparison core for a portfolio demo"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10,<10",
  "pydantic>=2.7,<3",
  "protobuf>=6.33.5,<6.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/vrp_demo"]

[tool.hatch.build.targets.wheel.force-include]
"ui" = "vrp_demo/ui"
