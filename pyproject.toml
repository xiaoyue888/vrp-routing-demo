[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vrp-portfolio-demo"
version = "0.1.0"
description = "Privacy-safe CVRPTW comparison core for a portfolio demo"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10,<10",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vrp_demo"]
